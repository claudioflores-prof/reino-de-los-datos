<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Reino de los Datos · RPG PAES M1</title>
<style>
:root{
  --bg:#16112a; --bg2:#211a3b; --panel:#2b2250; --panel2:#352a62; --borde:#4b3c80;
  --txt:#f4effd; --muted:#c3b8e0; --oro:#f6c544; --oro2:#b8860b;
  --perg:#fbf4e2; --perg2:#efe3c2; --tinta:#2a1f15; --azul:#1B4D7E; --azul2:#4A7CA8;
  --ok:#2f8f5b; --okc:#dff3e7; --mal:#c0392b; --malc:#fbe2df; --rojo:#e74c3c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(ellipse at top,#2c1f55 0%,var(--bg) 60%) fixed;background-color:var(--bg);
  color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:10px 14px 48px}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
.titulo{font-size:30px;text-align:center;margin-top:18px;color:var(--oro);letter-spacing:.5px;
  text-shadow:0 2px 0 #000,0 0 18px rgba(246,197,68,.35)}
.sub{text-align:center;color:var(--muted);margin:0 0 18px}
.panel{background:var(--panel);border:2px solid var(--borde);border-radius:14px;padding:14px;margin:12px 0;
  box-shadow:0 4px 0 rgba(0,0,0,.35)}
.panel h2{font-size:21px;color:var(--oro)}
.muted{color:var(--muted)}
.small{font-size:15px}
label.lbl{display:block;font-weight:700;margin:6px 0 6px}
input.txt{width:100%;font-size:18px;padding:12px;border-radius:10px;border:2px solid var(--borde);
  background:#130e25;color:var(--txt)}
input.txt:focus{outline:3px solid var(--oro);outline-offset:1px}
.btn{display:block;width:100%;font-size:18px;font-weight:700;padding:14px 16px;margin:10px 0 0;border-radius:12px;
  border:none;cursor:pointer;background:linear-gradient(#f8d465,#e0a92c);color:#2a1a00;box-shadow:0 4px 0 var(--oro2);
  font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--oro2)}
.btn.sec{background:var(--panel2);color:var(--txt);box-shadow:0 4px 0 #1b1533;border:2px solid var(--borde)}
.btn.chico{font-size:16px;padding:10px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:#ffb4a8;font-weight:700;min-height:1.2em;margin-top:6px}
.clases{display:grid;gap:10px}
.clase{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px;border-radius:12px;
  border:2px solid var(--borde);background:#1d1638;color:var(--txt);font-size:16px;cursor:pointer;font-family:inherit}
.clase .ico{font-size:34px;line-height:1}
.clase b{display:block;font-size:17px;margin-bottom:2px}
.clase[aria-pressed="true"]{border-color:var(--oro);background:#3a2d12;box-shadow:0 0 0 2px rgba(246,197,68,.35)}
/* HUD */
.hud{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;
  background:rgba(22,17,42,.94);border-bottom:2px solid var(--borde);padding:8px 4px;margin:0 -4px 6px;font-size:16px}
.hud .vida{letter-spacing:1px;font-size:17px}
.hud span{white-space:nowrap}
/* historia */
.hist{text-align:center}
.hist .gran{font-size:76px;line-height:1.1;margin:8px 0}
.hist p{font-size:19px}
.paso{color:var(--muted);font-size:15px}
/* mapa */
.region{display:flex;gap:12px;align-items:center}
.region .ico{font-size:40px;line-height:1;width:48px;text-align:center}
.region .info{flex:1}
.region .nom{font-weight:800;font-size:18px}
.estado{font-size:15px;font-weight:700}
.estado.ok{color:#8fe3b0}
.estado.lock{color:var(--muted)}
.region.bloq{opacity:.55}
.region.actual{border-color:var(--oro)}
.reglas{margin:0;padding-left:20px}
.reglas li{margin:4px 0}
/* batalla */
.enemigo{text-align:center;padding:10px 12px}
.enemigo .emoji{font-size:66px;line-height:1.1;display:inline-block}
.enemigo .nombre{font-size:20px;font-weight:800}
.tag{display:inline-block;background:var(--rojo);color:#fff;font-size:13px;font-weight:800;padding:2px 8px;border-radius:999px;
  vertical-align:middle;margin-left:6px;letter-spacing:.5px}
.pips{font-size:20px;letter-spacing:2px;margin-top:2px}
.lugar{color:var(--muted);font-size:15px}
.golpe{animation:golpe .45s}
@keyframes golpe{0%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(6deg)}
  60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:none}}
.muerto{filter:grayscale(1);opacity:.5;transform:rotate(90deg);transition:all .5s}
.carta{background:var(--perg);color:var(--tinta);border-radius:14px;padding:14px;margin:12px 0;border:3px solid var(--perg2);
  box-shadow:0 4px 0 rgba(0,0,0,.35)}
.carta p{margin:0 0 10px}
.carta .preg{font-weight:800;font-size:18px;margin-top:10px}
.tabla{border-collapse:collapse;margin:6px auto 4px;font-size:16px;min-width:60%;max-width:100%}
.tabla th,.tabla td{border:1.5px solid #8a7a5a;padding:6px 10px;text-align:center}
.tabla th{background:#e9dcb8}
.tabla .var{font-style:italic;font-weight:800;color:#8b1e1e}
.graf{display:block;width:100%;height:auto;margin:4px 0}
.picto{margin:6px 0;font-size:16px}
.picto .fila{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #c9b98f}
.picto .lab{width:120px;flex:none;font-weight:700}
.picto .ics{font-size:24px;letter-spacing:2px;white-space:nowrap}
.picto .medio{display:inline-block;width:.55em;overflow:hidden;vertical-align:bottom;white-space:nowrap}
.picto .ley{margin-top:6px;font-weight:700}
.ops{display:grid;gap:9px;margin-top:12px}
.op{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:11px;font-size:17px;
  background:#fffaf0;color:var(--tinta);border:2px solid #cdbb8f;cursor:pointer;font-family:inherit;line-height:1.35}
.op .let{flex:none;width:30px;height:30px;border-radius:50%;background:var(--azul);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.op:disabled{cursor:default}
.op.elim{opacity:.35;text-decoration:line-through}
.op.bien{background:var(--okc);border-color:var(--ok)}
.op.bien .let{background:var(--ok)}
.op.malo{background:var(--malc);border-color:var(--mal)}
.op.malo .let{background:var(--mal)}
.items{display:flex;gap:8px;flex-wrap:wrap}
.items .btn{flex:1 1 30%;margin-top:0;min-width:96px}
.escudo-on{color:#9fd8ff;font-weight:800;font-size:15px;margin-top:6px}
.fb{border-width:3px}
.fb.bien{border-color:var(--ok);background:#173a2a}
.fb.malo{border-color:var(--mal);background:#3d1a1d}
.fb h3{font-size:21px}
.fb ul{margin:6px 0 0;padding-left:20px}
.fb .exp{background:rgba(255,255,255,.07);border-radius:10px;padding:10px;margin-top:10px}
details summary{cursor:pointer;font-weight:700;color:var(--oro)}
/* tienda */
.prod{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--borde)}
.prod .ico{font-size:30px;width:40px;text-align:center}
.prod .d{flex:1;font-size:16px}
.prod .btn{width:auto;margin:0;padding:10px 12px;font-size:16px}
/* ficha */
.ficha .fila{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--borde)}
.barra{height:12px;background:#120d24;border-radius:6px;overflow:hidden;margin-top:4px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,#f6c544,#2f8f5b)}
.tema{padding:6px 0}
.copiado{color:#8fe3b0;font-weight:700;min-height:1.3em;margin-top:6px}
.pie{margin-top:18px;text-align:center}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:15px;cursor:pointer;font-family:inherit;padding:8px}
textarea.oculto{position:fixed;left:-9999px;top:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const BANCO = [{"id":"z1n1","zona":1,"tipo":"n","tema":"Tablas","enun":"El herrero de la aldea anotó cuántas espadas reparó cada día durante 20 días.","tabla":{"enc":["Espadas reparadas","N.° de días"],"filas":[[1,3],[2,5],[3,6],[4,4],[5,2]]},"preg":"¿En cuántos días reparó a lo más 3 espadas?","ops":["14","12","8","6"],"exp":"«A lo más 3» significa 1, 2 o 3 espadas: 3 + 5 + 6 = 14 (la frecuencia acumulada hasta 3). Ojo: 12 corresponde a «al menos 3» y 8 a «menos de 3»."},{"id":"z1n2","zona":1,"tipo":"n","tema":"Tablas","enun":"En la posada se registró la bebida que pidió cada uno de 40 aventureros.","tabla":{"enc":["Bebida","Aventureros"],"filas":[["Jugo de maná",14],["Té de hierbas",10],["Agua de manantial",16]]},"preg":"¿Qué porcentaje de los aventureros pidió té de hierbas?","ops":["25 %","10 %","35 %","40 %"],"exp":"Frecuencia relativa = 10/40 = 0,25, es decir, 25 %. El 10 % confunde la frecuencia absoluta con el porcentaje; 35 % y 40 % son el jugo (14/40) y el agua (16/40)."},{"id":"z1n3","zona":1,"tipo":"n","tema":"Tablas","enun":"En un torneo, cada arquero disparó 3 flechas. La tabla muestra cuántas acertó cada uno de los 20 arqueros.","tabla":{"enc":["Flechas acertadas","N.° de arqueros"],"filas":[[0,4],[1,"k"],[2,7],[3,3],["Total",20]]},"preg":"¿Cuántos arqueros acertaron exactamente 1 flecha?","ops":["6","9","14","3"],"exp":"Las frecuencias suman el total: 4 + k + 7 + 3 = 20, así que k = 20 − 14 = 6. El 14 es la suma de las otras frecuencias, no el valor de k; el 9 sale de olvidar una de ellas (20 − 4 − 7)."},{"id":"z1n4","zona":1,"tipo":"n","tema":"Tablas","enun":"El gremio de magos tiene 80 miembros. La frecuencia relativa de los que dominan el fuego es 0,15.","preg":"¿Cuántos miembros dominan el fuego?","ops":["12","15","68","5"],"exp":"Frecuencia absoluta = frecuencia relativa · total = 0,15 · 80 = 12. El 15 sale de leer 0,15 como «15 personas»; 68 son los que NO dominan el fuego."},{"id":"z1n5","zona":1,"tipo":"n","tema":"Tablas","enun":"Un explorador abrió 20 cofres y contó las monedas de oro de cada uno.","tabla":{"enc":["Monedas","N.° de cofres"],"filas":[[0,2],[1,5],[2,8],[3,3],[4,2]]},"preg":"¿Qué porcentaje de los cofres tenía menos de 3 monedas?","ops":["75 %","40 %","90 %","25 %"],"exp":"«Menos de 3» = 0, 1 o 2 monedas: 2 + 5 + 8 = 15 cofres, y 15/20 = 75 %. El 90 % sería «3 o menos» (18/20) y el 40 % son solo los cofres con 2 monedas."},{"id":"z1j1","zona":1,"tipo":"j","tema":"Tablas","enun":"El escriba anotó cuántas misiones completó cada uno de 18 aventureros, pero dejó la tabla a medio llenar. F es la frecuencia acumulada.","tabla":{"enc":["Misiones","f","F"],"filas":[[1,2,2],[2,"a",6],[3,5,11],[4,"b",17],[5,1,18]]},"preg":"¿Cuánto vale a + b?","ops":["10","23","16","8"],"exp":"Cada F es la anterior más la nueva f: a = 6 − 2 = 4 y b = 17 − 11 = 6, así que a + b = 10. El 23 sale de copiar los valores de F (6 + 17) y el 16, de calcular b = 17 − 5."},{"id":"z1j2","zona":1,"tipo":"j","tema":"Tablas","enun":"Se pesaron 30 dragones bebé y los resultados se agruparon en intervalos.","tabla":{"enc":["Masa (kg)","N.° de dragones"],"filas":[["[10, 20[",4],["[20, 30[",9],["[30, 40[",11],["[40, 50[",6]]},"preg":"¿Cuál de las siguientes afirmaciones es verdadera?","ops":["El intervalo modal es [30, 40[.","La marca de clase de [20, 30[ es 20.","Más de la mitad pesa menos de 30 kg.","La mediana está en el intervalo [20, 30[."],"exp":"El intervalo con mayor frecuencia (11) es [30, 40[. La marca de clase de [20, 30[ es 25, el punto medio. Bajo 30 kg hay 4 + 9 = 13 dragones, menos de la mitad de 30. La mediana está entre los datos 15.º y 16.º, y ambos caen en [30, 40[ (la acumulada pasa de 13 a 24)."},{"id":"z1j3","zona":1,"tipo":"j","tema":"Tablas","enun":"En el registro del gremio, 7 aventureros completaron exactamente 3 misiones. Eso corresponde a una frecuencia relativa de 0,2.","preg":"¿Cuántos aventureros hay en el registro?","ops":["35","14","1,4","70"],"exp":"Frecuencia relativa = f / n, así que 0,2 = 7 / n y n = 7 / 0,2 = 35. El 1,4 sale de multiplicar 7 · 0,2 en vez de dividir; el 70 sale de dividir por 0,1."},{"id":"z2n1","zona":2,"tipo":"n","tema":"Gráficos","enun":"La alquimista del bosque registró las pociones que vendió cada día.","graf":{"t":"bar","cats":["Lun","Mar","Mié","Jue","Vie"],"vals":[12,8,15,10,15],"ymin":0,"ymax":20,"paso":5,"ylab":"Pociones","etiq":true},"preg":"¿Cuántas pociones vendió desde el martes hasta el jueves (ambos incluidos)?","ops":["33","18","15","60"],"exp":"Martes + miércoles + jueves = 8 + 15 + 10 = 33. El 18 deja fuera el miércoles y el 60 es el total de la semana."},{"id":"z2n2","zona":2,"tipo":"n","tema":"Gráficos","enun":"El gráfico muestra el elemento que domina cada uno de los 200 hechiceros de la academia.","graf":{"t":"pie","cats":["Fuego","Agua","Tierra","Aire"],"pct":[35,25,30,10]},"preg":"¿Cuántos hechiceros dominan tierra o aire?","ops":["80","40","60","120"],"exp":"Tierra o aire = 30 % + 10 % = 40 %, y el 40 % de 200 es 80. El 40 es el porcentaje y no la cantidad; 60 es solo tierra y 120 corresponde a fuego y agua."},{"id":"z2n3","zona":2,"tipo":"n","tema":"Gráficos","enun":"El histograma muestra la estatura de 40 elfos.","graf":{"t":"hist","lims":[150,160,170,180,190],"f":[6,10,16,8],"ymax":20,"paso":5,"xlab":"Estatura (cm)","ylab":"N.° de elfos"},"preg":"¿Cuántos elfos miden 170 cm o más?","ops":["24","16","8","32"],"exp":"Desde 170 cm hacia arriba están los intervalos [170, 180[ y [180, 190[: 16 + 8 = 24. El 16 considera un solo intervalo y el 32 cuenta los que miden menos de 180 cm."},{"id":"z2n4","zona":2,"tipo":"n","tema":"Gráficos","enun":"El tesorero del reino anotó el oro guardado en la bóveda al final de cada mes (en miles de monedas).","graf":{"t":"line","cats":["Ene","Feb","Mar","Abr","May","Jun"],"vals":[20,26,23,30,31,25],"ymin":0,"ymax":35,"paso":5,"ylab":"Miles de monedas","etiq":true},"preg":"¿Entre qué meses consecutivos aumentó más el oro?","ops":["De marzo a abril","De enero a febrero","De abril a mayo","De mayo a junio"],"exp":"Los aumentos son: enero→febrero +6, marzo→abril +7 y abril→mayo +1. El mayor es de marzo a abril (+7). De mayo a junio hay un cambio grande, pero es una disminución (−6)."},{"id":"z2n5","zona":2,"tipo":"n","tema":"Gráficos","enun":"El pictograma muestra los escudos forjados por tres herrerías.","graf":{"t":"picto","icono":"🛡️","valor":4,"unidad":"escudos","filas":[["Herrería Norte",3],["Herrería Sur",5],["Herrería Este",2.5]]},"preg":"¿Cuántos escudos más forjó la Herrería Sur que la Herrería Este?","ops":["10","2,5","12","30"],"exp":"Sur: 5 · 4 = 20 escudos. Este: 2,5 · 4 = 10 escudos. Diferencia: 20 − 10 = 10. El 2,5 es la diferencia de símbolos, no de escudos; el 12 aparece si se ignora el medio símbolo."},{"id":"z2j1","zona":2,"tipo":"j","tema":"Gráficos","enun":"Resultados de la votación para elegir al líder del gremio. Un aventurero mira el gráfico y dice: «Ciro sacó como el triple de votos que Aria».","graf":{"t":"bar","cats":["Aria","Bruno","Ciro"],"vals":[94,98,102],"ymin":90,"ymax":104,"paso":2,"ylab":"Votos","etiq":true},"preg":"¿Por qué su afirmación es incorrecta?","ops":["El eje parte en 90: la diferencia real es de solo 8 votos.","Con votos se debe usar un gráfico circular y no de barras.","Ciro obtuvo el doble de votos que Aria y no el triple.","Las barras deberían estar ordenadas de mayor a menor."],"exp":"Las barras parten en 90 y no en 0; por eso la de Ciro (102) se ve tres veces más alta que la de Aria (94). En realidad la diferencia es de solo 8 votos: Ciro tiene apenas un 8,5 % más que Aria."},{"id":"z2j2","zona":2,"tipo":"j","tema":"Gráficos","enun":"En el gráfico circular del ejército real, el sector de los arqueros mide 72°. El ejército tiene 250 soldados.","preg":"¿Cuántos soldados son arqueros?","ops":["50","72","180","20"],"exp":"72° de 360° es 72/360 = 0,2, o sea el 20 % del círculo, y el 20 % de 250 es 50. El 180 sale de usar 72 como si fuera un porcentaje (72 % de 250); el 20 es el porcentaje, no la cantidad."},{"id":"z2j3","zona":2,"tipo":"j","tema":"Gráficos","enun":"El histograma muestra cuánto tardaron 50 caballeros en cruzar el laberinto.","graf":{"t":"hist","lims":[0,10,20,30,40],"f":[5,15,20,10],"ymax":25,"paso":5,"xlab":"Tiempo (min)","ylab":"N.° de caballeros"},"preg":"¿Cuál de las siguientes afirmaciones es verdadera?","ops":["El 40 % tardó al menos 20 min y menos de 30 min.","La mitad de los caballeros tardó menos de 20 min.","Exactamente 10 caballeros tardaron 30 minutos.","El intervalo [10, 20[ es el de mayor frecuencia."],"exp":"En [20, 30[ hay 20 caballeros, y 20/50 = 40 %. Bajo 20 minutos hay 5 + 15 = 20, que no es la mitad de 50. Los 10 del último intervalo tardaron entre 30 y 40 minutos: el histograma no permite saber cuántos tardaron exactamente 30. El intervalo de mayor frecuencia es [20, 30[."},{"id":"z3n1","zona":3,"tipo":"n","tema":"Medidas","enun":"La tabla muestra cuántos hechizos lanzó cada uno de 10 magos durante un duelo.","tabla":{"enc":["Hechizos","N.° de magos"],"filas":[[1,2],[2,3],[3,4],[4,1]]},"preg":"¿Cuál es el promedio de hechizos por mago?","ops":["2,4","2,5","6","3"],"exp":"Promedio = (1·2 + 2·3 + 3·4 + 4·1) / 10 = 24 / 10 = 2,4. El 2,5 promedia solo los valores 1, 2, 3 y 4 sin las frecuencias; el 6 divide por 4 en vez de por 10; el 3 es la moda."},{"id":"z3n2","zona":3,"tipo":"n","tema":"Medidas","enun":"La tabla muestra cuántos goblins derrotó cada uno de 15 guerreros.","tabla":{"enc":["Goblins","N.° de guerreros"],"filas":[[0,3],[1,4],[2,2],[3,5],[4,1]]},"preg":"¿Cuál es la mediana?","ops":["2","3","1,8","1"],"exp":"Con 15 datos, la mediana es el dato 8.º. Acumulando: 3 (hasta 0), 7 (hasta 1), 9 (hasta 2). El dato 8.º vale 2. El 3 es la moda y el 1,8 es el promedio."},{"id":"z3n3","zona":3,"tipo":"n","tema":"Medidas","enun":"Notas de un aprendiz de mago en seis pruebas: 6,5 ; 5,0 ; 3,0 ; 6,5 ; 4,0 ; 5,5","preg":"¿Cuál es la mediana de sus notas?","ops":["5,25","4,75","6,5","5,0"],"exp":"Primero se ordenan: 3,0 ; 4,0 ; 5,0 ; 5,5 ; 6,5 ; 6,5. Con 6 datos, la mediana es el promedio de los dos centrales: (5,0 + 5,5) / 2 = 5,25. El 4,75 sale de promediar los centrales sin ordenar (3,0 y 6,5); el 6,5 es la moda."},{"id":"z3n4","zona":3,"tipo":"n","tema":"Medidas","enun":"Cuatro cofres tienen, en promedio, 30 monedas. Luego se encuentra un quinto cofre con 55 monedas.","preg":"¿Cuál es el nuevo promedio de monedas por cofre?","ops":["35","42,5","43,75","41"],"exp":"Los 4 cofres suman 4 · 30 = 120 monedas. Con el quinto: 120 + 55 = 175, y 175 / 5 = 35. El 42,5 promedia 30 y 55 como si fueran solo dos datos; el 43,75 divide por 4 en vez de por 5."},{"id":"z3n5","zona":3,"tipo":"n","tema":"Medidas","enun":"Distancia (en metros) a la que lanzaron sus hachas 12 enanos, ya ordenadas: 8 ; 9 ; 11 ; 12 ; 12 ; 14 ; 15 ; 15 ; 16 ; 18 ; 20 ; 23","preg":"¿Cuál es el percentil 25 (P₂₅)?","ops":["11,5","11","12","14,5"],"exp":"Con el método del curso, la posición es 25 · 12 / 100 = 3. Como es entero, P₂₅ es el promedio de los datos 3.º y 4.º: (11 + 12) / 2 = 11,5. Tomar solo el 3.º (11) o solo el 4.º (12) es el error típico; el 14,5 es la mediana."},{"id":"z3j1","zona":3,"tipo":"j","tema":"Medidas","enun":"El diagrama de cajón resume los puntos de vida de 40 monstruos de la torre.","graf":{"t":"box","series":[{"nom":"","v":[10,25,35,50,80]}],"min":0,"max":90,"paso":10,"xlab":"Puntos de vida"},"preg":"¿Cuál de las siguientes afirmaciones es verdadera?","ops":["Cerca de 20 monstruos tienen entre 25 y 50 puntos de vida.","El promedio de los puntos de vida es 35.","Cerca de 30 monstruos tienen más de 50 puntos de vida.","El rango de los puntos de vida es 25."],"exp":"Entre Q₁ = 25 y Q₃ = 50 está el 50 % central: la mitad de 40, unos 20 monstruos. El 35 es la mediana; el cajón no muestra el promedio, así que no se puede afirmar que sea 35. Sobre Q₃ queda cerca del 25 %, unos 10 monstruos. El rango es 80 − 10 = 70; el 25 es el rango intercuartil."},{"id":"z3j2","zona":3,"tipo":"j","tema":"Medidas","enun":"La tabla muestra el nivel que alcanzó cada uno de 20 aventureros en la torre.","tabla":{"enc":["Nivel","N.° de aventureros"],"filas":[[1,2],[2,6],[3,5],[4,4],[5,3]]},"preg":"¿Cuál es el percentil 80 (P₈₀)?","ops":["4","4,5","3","16"],"exp":"Posición: 80 · 20 / 100 = 16, que es entero: P₈₀ es el promedio de los datos 16.º y 17.º. Acumulando: 2, 8, 13, 17, 20, así que los datos 14.º al 17.º valen 4 y P₈₀ = (4 + 4) / 2 = 4. El 16 es la posición, no el percentil; el 3 es la mediana."},{"id":"z3j3","zona":3,"tipo":"j","tema":"Medidas","enun":"Un mago obtuvo 5,2 ; 6,0 y 4,8 en sus tres primeros duelos.","preg":"¿Qué nota necesita en el cuarto duelo para que su promedio sea exactamente 5,5?","ops":["6,0","5,5","5,7","6,5"],"exp":"Para promediar 5,5 con 4 notas, la suma debe ser 4 · 5,5 = 22. Ya lleva 5,2 + 6,0 + 4,8 = 16, así que le falta 22 − 16 = 6,0. El 5,7 sale de promediar el promedio actual (5,33) con la nota nueva, como si fueran solo dos datos."},{"id":"z4n1","zona":4,"tipo":"n","tema":"Probabilidad","enun":"Un cofre maldito contiene 3 rubíes, 5 esmeraldas y 4 zafiros. Sacas una gema al azar.","preg":"¿Cuál es la probabilidad de que NO sea una esmeralda?","ops":["7/12","5/12","2/3","5/7"],"exp":"Hay 12 gemas y 7 no son esmeraldas (3 + 4), así que P = 7/12. El 5/12 es la probabilidad de que SÍ sea esmeralda; el 2/3 supone que los tres tipos de gema son igual de probables, y no lo son."},{"id":"z4n2","zona":4,"tipo":"n","tema":"Probabilidad","enun":"Una ruleta mágica tiene 5 sectores iguales: 2 de fuego y 3 de hielo. Se gira dos veces.","preg":"¿Cuál es la probabilidad de obtener fuego las dos veces?","ops":["4/25","4/5","2/5","1/4"],"exp":"Los giros son independientes: P = 2/5 · 2/5 = 4/25. El 4/5 suma en vez de multiplicar; el 1/4 supone que FF, FH, HF y HH son igual de probables, pero hay más hielo que fuego."},{"id":"z4n3","zona":4,"tipo":"n","tema":"Probabilidad","enun":"Una bolsa tiene 4 pergaminos de ataque y 2 de defensa. Sacas dos, uno tras otro, sin devolver el primero.","preg":"¿Cuál es la probabilidad de que ambos sean de defensa?","ops":["1/15","1/9","8/15","1/3"],"exp":"Sin reposición: 2/6 · 1/5 = 2/30 = 1/15 (al sacar el primero quedan 5 pergaminos y solo 1 de defensa). El 1/9 = (1/3)·(1/3) sería con reposición; el 8/15 suma las probabilidades en vez de multiplicarlas."},{"id":"z4n4","zona":4,"tipo":"n","tema":"Probabilidad","enun":"La probabilidad de que un hechizo funcione es 0,9. El mago lo lanza dos veces y los intentos son independientes.","preg":"¿Cuál es la probabilidad de que falle al menos una vez?","ops":["0,19","0,2","0,01","0,81"],"exp":"Lo contrario de «falla al menos una vez» es «funciona las dos veces»: 0,9 · 0,9 = 0,81. Entonces P = 1 − 0,81 = 0,19. El 0,2 suma 0,1 + 0,1 y cuenta dos veces el caso en que falla ambas; el 0,01 es la probabilidad de fallar las dos."},{"id":"z4n5","zona":4,"tipo":"n","tema":"Probabilidad","enun":"Los 30 aventureros del gremio se clasifican así:","tabla":{"enc":["","Guerrero","Mago"],"filas":[["Humano",8,7],["Elfo",5,10]]},"preg":"Si se elige uno al azar, ¿cuál es la probabilidad de que sea elfo o mago?","ops":["11/15","1/3","1/2","17/30"],"exp":"Elfos: 15. Magos: 17. Los elfos magos (10) quedan contados dos veces, así que se restan: (15 + 17 − 10) / 30 = 22/30 = 11/15. El 1/3 = 10/30 es «elfo Y mago»; el 1/2 son solo los elfos y el 17/30, solo los magos."},{"id":"z4j1","zona":4,"tipo":"j","tema":"Probabilidad","enun":"Un saco tiene 3 llaves de bronce y 2 de plata. Se sacan dos llaves al azar, sin reposición.","preg":"¿Cuál es la probabilidad de que sean de distinto metal?","ops":["3/5","3/10","12/25","1/2"],"exp":"Hay dos órdenes posibles: bronce-plata (3/5 · 2/4 = 6/20) y plata-bronce (2/5 · 3/4 = 6/20). Sumando: 12/20 = 3/5. El 3/10 considera un solo orden; el 12/25 calcula como si fuera con reposición."},{"id":"z4j2","zona":4,"tipo":"j","tema":"Probabilidad","enun":"En un nido hay 6 huevos de dragón rojos y algunos azules. Al elegir un huevo al azar, la probabilidad de que sea rojo es 2/5.","preg":"¿Cuántos huevos azules hay?","ops":["9","15","4","10"],"exp":"Si 6 huevos son los 2/5 del total, el total es 6 · 5/2 = 15. Entonces hay 15 − 6 = 9 azules. El 15 es el total de huevos, no los azules."},{"id":"z4j3","zona":4,"tipo":"j","tema":"Probabilidad","enun":"Se elige al azar una de 30 runas numeradas del 1 al 30.","preg":"¿Cuál es la probabilidad de que el número sea múltiplo de 3 o múltiplo de 5?","ops":["7/15","8/15","1/15","1/3"],"exp":"Múltiplos de 3: 10. Múltiplos de 5: 6. Los múltiplos de 15 (15 y 30) están en ambos grupos, así que se restan: 10 + 6 − 2 = 14, y 14/30 = 7/15. El 8/15 = 16/30 no resta los repetidos; el 1/15 son solo los múltiplos de 15."},{"id":"f1","zona":5,"tipo":"f","tema":"Medidas","enun":"La tabla muestra el oro que ganó un grupo de mercenarios en cada misión. El promedio de oro por misión es 18.","tabla":{"enc":["Oro por misión","N.° de misiones"],"filas":[[10,4],[20,"a"],[30,2]]},"preg":"¿Cuál es el valor de a?","ops":["4","0,4","6","8"],"exp":"(10·4 + 20·a + 30·2) / (4 + a + 2) = 18, así que 100 + 20a = 108 + 18a y a = 4. Comprobación: 180 / 10 = 18. El 0,4 aparece si se divide solo por 6, olvidando que a también suma al total de misiones."},{"id":"f2","zona":5,"tipo":"f","tema":"Probabilidad","enun":"Un arquero acierta al blanco con probabilidad 3/4 en cada disparo. Dispara 3 flechas y los disparos son independientes.","preg":"¿Cuál es la probabilidad de que acierte al menos una?","ops":["63/64","27/64","1/64","3/4"],"exp":"Lo contrario de «al menos una» es «ninguna»: (1/4)·(1/4)·(1/4) = 1/64. Entonces P = 1 − 1/64 = 63/64. El 27/64 es acertar las tres y el 1/64 es fallar las tres."},{"id":"f3","zona":5,"tipo":"f","tema":"Medidas","enun":"Los diagramas de cajón comparan los puntajes de batalla de dos gremios, A y B.","graf":{"t":"box","series":[{"nom":"A","v":[20,30,40,45,60]},{"nom":"B","v":[15,35,38,50,70]}],"min":10,"max":80,"paso":10,"xlab":"Puntaje"},"preg":"¿Cuál de las siguientes afirmaciones es verdadera?","ops":["En B, cerca del 75 % de los puntajes es 35 o más.","La mediana de A es menor que la mediana de B.","El rango de A es mayor que el rango de B.","En A, el 50 % central está entre 20 y 45."],"exp":"En B, Q₁ = 35: bajo él queda cerca del 25 % y sobre él cerca del 75 %. La mediana de A (40) es mayor que la de B (38). Los rangos son 60 − 20 = 40 (A) y 70 − 15 = 55 (B). El 50 % central de A va de Q₁ = 30 a Q₃ = 45."},{"id":"f4","zona":5,"tipo":"f","tema":"Medidas","enun":"La estatura promedio de 9 caballeros es 175 cm. Se une un décimo caballero y el promedio sube a 176 cm.","preg":"¿Cuánto mide el décimo caballero?","ops":["185 cm","176 cm","177 cm","180 cm"],"exp":"Antes sumaban 9 · 175 = 1575 cm; ahora suman 10 · 176 = 1760 cm. El nuevo mide 1760 − 1575 = 185 cm. Para subir 1 cm el promedio de 10 personas, tiene que aportar 10 cm más que el promedio anterior: 175 + 10 = 185."},{"id":"f5","zona":5,"tipo":"f","tema":"Probabilidad","enun":"El gráfico muestra los monstruos que hay en la última mazmorra.","graf":{"t":"bar","cats":["Esqueleto","Araña","Murciélago","Gólem"],"vals":[12,9,15,4],"ymin":0,"ymax":16,"paso":4,"ylab":"Monstruos","etiq":true},"preg":"Si aparece un monstruo al azar, ¿cuál es la probabilidad de que NO sea murciélago ni gólem?","ops":["21/40","19/40","1/2","3/8"],"exp":"Hay 12 + 9 + 15 + 4 = 40 monstruos. Los que no son murciélago ni gólem son los esqueletos y las arañas: 12 + 9 = 21, así que P = 21/40. El 19/40 es lo contrario (murciélago o gólem); el 1/2 supone que los 4 tipos son igual de probables."}];

function h(tag, attrs, kids) {
  const el = document.createElement(tag);

    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  if (kids !== undefined && kids !== null) {
    (Array.isArray(kids) ? kids : [kids]).forEach(c => {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);

const COL = ["#1B4D7E", "#B45309", "#2E7D32", "#7B3FA0", "#9AB6D1"];
function grafBar(g) {
  const W = 360, H = 240, ml = 46, mr = 10, mt = 20, mb = 40, pw = W - ml - mr, ph = H - mt - mb;
  const s = sv("svg", { viewBox: `0 0 ${W} ${H}`, class: "graf", role: "img", "aria-label": "Gráfico de barras" });
  const y = v => mt + ph - (v - g.ymin) / (g.ymax - g.ymin) * ph;
  for (let v = g.ymin; v <= g.ymax + 1e-9; v += g.paso) {
    s.appendChild(sv("line", { x1: ml, y1: y(v), x2: W - mr, y2: y(v), stroke: "#c9bf9f", "stroke-width": 1 }));
    s.appendChild(sv("text", { x: ml - 6, y: y(v) + 5, "text-anchor": "end", "font-size": 14, fill: "#2a1f15" }, fmt(v)));
  }
  const n = g.cats.length, slot = pw / n, bw = slot * 0.58;
  g.vals.forEach((v, i) => {
    const x = ml + slot * i + (slot - bw) / 2;
    s.appendChild(sv("rect", { x: x, y: y(v), width: bw, height: y(g.ymin) - y(v), fill: COL[0] }));
    if (g.etiq) s.appendChild(sv("text", { x: x + bw / 2, y: y(v) - 5, "text-anchor": "middle", "font-size": 14, "font-weight": 700, fill: "#2a1f15" }, fmt(v)));
    s.appendChild(sv("text", { x: x + bw / 2, y: mt + ph + 19, "text-anchor": "middle", "font-size": 14, fill: "#2a1f15" }, g.cats[i]));
  });
  s.appendChild(sv("line", { x1: ml, y1: mt - 4, x2: ml, y2: mt + ph, stroke: "#2a1f15", "stroke-width": 1.5 }));
  s.appendChild(sv("line", { x1: ml, y1: mt + ph, x2: W - mr, y2: mt + ph, stroke: "#2a1f15", "stroke-width": 1.5 }));
  if (g.ylab) s.appendChild(sv("text", { x: 13, y: mt + ph / 2, "text-anchor": "middle", "font-size": 14, fill: "#2a1f15", transform: `rotate(-90 13 ${mt + ph / 2})` }, g.ylab));
  return s;
}
function grafHist(g) {

  const s = sv("svg", { viewBox: `0 0 ${W} ${H}`, class: "graf", role: "img", "aria-label": "Histograma" });

    s.appendChild(sv("text", { x: ml - 6, y: y(v) + 5, "text-anchor": "end", "font-size": 14, fill: "#2a1f15" }, fmt(v)));

  g.f.forEach((f, i) => {
    const a = x(g.lims[i]), b = x(g.lims[i + 1]);

    s.appendChild(sv("text", { x: (a + b) / 2, y: y(f) - 5, "text-anchor": "middle", "font-size": 14, "font-weight": 700, fill: "#2a1f15" }, fmt(f)));
  });
  g.lims.forEach(v => {

    s.appendChild(sv("text", { x: x(v), y: mt + ph + 20, "text-anchor": "middle", "font-size": 14, fill: "#2a1f15" }, fmt(v)));
  });

/* ---------------- lógica del juego ---------------- */
function nuevoEstado(nombre, clase) {
  const c = CLASES[clase];
  return {
    v: 1, nombre: nombre, clase: clase, hpMax: c.hp, hp: c.hp, oro: 20, xp: 0,
    items: { pocion: 1, pergamino: clase === "mago" ? 1 : 0, escudo: 0 }, escudoActivo: false,
    zona: 0, desbloq: 0, enemigo: 0, enemigoHp: 1, pools: {},
    stats: { "Tablas": [0, 0], "Gráficos": [0, 0], "Medidas": [0, 0], "Probabilidad": [0, 0] },
    preguntas: 0, aciertos: 0, caidas: 0, criticos: 0, inicio: Date.now(), fin: null,

}
function enemigoActual() {
  const z = ZONAS[S.zona];
  if (z.final) return { emoji: z.jefe[0], nombre: z.jefe[1], hp: 3, jefe: true, final: true, tipo: "f" };
  if (S.enemigo < 3) return { emoji: z.enemigos[S.enemigo][0], nombre: z.enemigos[S.enemigo][1], hp: 1, jefe: false, final: false, tipo: "n" };
  return { emoji: z.jefe[0], nombre: z.jefe[1], hp: 2, jefe: true, final: false, tipo: "j" };
}
function sacarItem(clave, evitar) {
  if (!S.pools[clave] || S.pools[clave].length === 0) {
    const zona = parseInt(clave[0], 10), tipo = clave[1];
    let ids = barajar(BANCO.filter(b => b.zona === zona && b.tipo === tipo).map(b => b.id));
    if (ids.length > 1 && ids[0] === evitar) { const t = ids[0]; ids[0] = ids[1]; ids[1] = t; }
    S.pools[clave] = ids;
  }
  return S.pools[clave].shift();
}
function nuevaPregunta() {
  const e = enemigoActual();
  const clave = e.final ? "5f" : (S.zona + 1) + e.tipo;
  const id = sacarItem(clave, S.q ? S.q.id : null);
  S.q = { id: id, orden: barajar([0, 1, 2, 3]), elim: [], t0: Date.now() };
  S.fb = null;
}
function entrarZona(i) {
  if (i !== S.desbloq) return;
  S.zona = i; S.enemigo = 0;
  if (S.clase === "mago") S.items.pergamino += 1;
  if (S.clase === "picaro") S.items.escudo += 1;
  iniciarEnemigo();
  guardar(); render(true);
}
function iniciarEnemigo() {
  const e = enemigoActual();
  S.enemigoHp = e.hp;
  S.q = null;
  nuevaPregunta();
  S.fase = "batalla";
}
function ganarOro(n) {
  const m = S.clase === "picaro" ? 1.5 : 1;
  const g = Math.round(n * m);
  S.oro += g;
  return g;
}
function responder(pos) {
  if (S.fb || !S.q) return;
  const it = POR_ID[S.q.id];
  const e = enemigoActual();
  const ok = S.q.orden[pos] === 0;
  const dt = Date.now() - S.q.t0;
  const msgs = [];
  S.preguntas++;
  S.stats[it.tema][1]++;
  let crit = false, subio = null;
  if (ok) {
    S.aciertos++;
    S.stats[it.tema][0]++;
    crit = dt <= 45000;
    if (crit) S.criticos++;
    const nivAntes = nivel();
    const xpG = (e.final ? 20 : (e.jefe ? 15 : 10)) + (crit ? 5 : 0);
    S.xp += xpG;
    S.enemigoHp--;
    let oroBase = crit ? 3 : 0;
    if (S.enemigoHp <= 0) oroBase += e.final ? 100 : (e.jefe ? 40 : 15);
    const oroG = oroBase > 0 ? ganarOro(oroBase) : 0;
    msgs.push(crit ? "⚡ ¡Golpe crítico! Respondiste en menos de 45 s." : "🗡️ ¡Golpe certero!");
    msgs.push("+" + xpG + " XP" + (oroG ? " · +" + oroG + " de oro" : ""));
    if (S.enemigoHp <= 0) msgs.push("🏆 ¡Derrotaste a " + e.nombre + "!");
    else msgs.push(e.nombre + " resiste: le quedan " + S.enemigoHp + " de vida.");
    const nivDesp = nivel();
    if (nivDesp > nivAntes) {
      S.hp = Math.min(S.hpMax, S.hp + 1);
      subio = nivDesp;
      msgs.push("⬆️ ¡Subiste a nivel " + nivDesp + ": " + titulo(nivDesp) + "! Recuperas 1 ❤️.");
    }
  } else {
    if (S.escudoActivo) {
      S.escudoActivo = false;
      msgs.push("🛡️ Tu escudo absorbió el golpe: no pierdes vida.");
    } else {
      S.hp--;
      msgs.push("💥 " + e.nombre + " te golpea: pierdes 1 ❤️.");
    }
    if (S.hp <= 0) msgs.push("Te quedaste sin vida…");
    else msgs.push("El enemigo sigue en pie. Lee la explicación: viene otra pregunta.");
  }
  S.fb = { pos: pos, ok: ok, crit: crit, msgs: msgs, derrotado: S.enemigoHp <= 0, caido: S.hp <= 0, subio: subio };
  S.log.push([S.q.id, ok ? 1 : 0, Math.round(dt / 1000)]);
  guardar();
  render(false);
  const f = document.getElementById("fb");
  if (f && f.scrollIntoView) f.scrollIntoView({ behavior: "smooth", block: "start" });
}
function continuar() {
  const fb = S.fb;
  if (!fb) return;
  if (fb.caido) {
    S.fase = "caida";
  } else if (fb.derrotado) {
    const e = enemigoActual();
    if (e.final) {
      S.fin = Date.now();
      S.fase = "final";
      S.q = null;
    } else if (e.jefe) {
      S.desbloq = S.zona + 1;
      const antes = S.hp;
      S.hp = Math.min(S.hpMax, S.hp + 1);
      S.posada = { zona: S.zona, curo: S.hp - antes };
      S.fase = "posada";
      S.q = null;
    } else {
      S.enemigo++;
      iniciarEnemigo();
    }
  } else {
    nuevaPregunta();
  }
  S.fb = null;
  guardar();
  render(true);
}
function levantarse() {
  S.hp = Math.min(3, S.hpMax);
  S.oro = Math.floor(S.oro / 2);
  S.caidas++;
  nuevaPregunta();
  S.fase = "batalla";
  guardar(); render(true);
}
function usarPocion() {
  if (S.items.pocion <= 0 || S.hp >= S.hpMax) return;
  S.items.pocion--; S.hp = Math.min(S.hpMax, S.hp + 2);
  guardar(); render(false);
}
function usarPergamino() {
  if (S.items.pergamino <= 0 || !S.q || S.fb || S.q.elim.length) return;
  const malas = [0, 1, 2, 3].filter(p => S.q.orden[p] !== 0);
  S.q.elim = barajar(malas).slice(0, 2);
  S.items.pergamino--;
  guardar(); render(false);
}
function usarEscudo() {
  if (S.items.escudo <= 0 || S.escudoActivo || S.fb) return;
  S.items.escudo--; S.escudoActivo = true;
  guardar(); render(false);
}
function comprar(tipo) {
  if (S.oro < PRECIOS[tipo]) return;
  S.oro -= PRECIOS[tipo]; S.items[tipo]++;
  guardar(); render(false);
}

/* ---------------- resumen ---------------- */
function temaDebil() {
  let peor = null, pr = 2;
  TEMAS.forEach(t => {
    const [a, n] = S.stats[t];
    if (n > 0 && a / n < pr) { pr = a / n; peor = t; }
  });
  if (peor === null) return "—";
  if (pr === 1) return "ninguno: ¡todo perfecto!";
  return peor;
}
function hashCod(str) {
  let x = 5381;
  for (let i = 0; i < str.length; i++) x = ((x * 33) ^ str.charCodeAt(i)) >>> 0;
  let y = 52711;
  for (let i = str.length - 1; i >= 0; i--) y = ((y * 31) ^ str.charCodeAt(i)) >>> 0;
  const s = (x.toString(36) + y.toString(36)).toUpperCase().replace(/[^A-Z0-9]/g, "").padEnd(8, "X");
  return s.slice(0, 4) + "-" + s.slice(4, 8);
}
function progresoTexto() {
  if (S.fase === "final") return "Derrotó al Ensayo Interminable 🐉";
  const z = ZONAS[Math.min(S.zona, 4)];
  if (S.fase === "mapa" || S.fase === "posada" || S.fase === "historia") {
    return S.desbloq === 0 ? "Recién comienza la aventura" : "Superó " + S.desbloq + " de 4 regiones";
  }
  const e = enemigoActual();
  return "Va en " + z.nombre + " (" + (e.final ? "jefe final" : e.jefe ? "jefe de la región" : "enemigo " + (S.enemigo + 1) + " de 3") + ")";
}
function resumenTexto() {
  const pct = S.preguntas ? Math.round(100 * S.aciertos / S.preguntas) : 0;
  const t = transcurrido();
  const ritmo = S.preguntas ? durTexto(t / S.preguntas) : "—";
  const porTema = TEMAS.map(tm => tm + " " + S.stats[tm][0] + "/" + S.stats[tm][1]).join(" · ");
  const n = nivel();
  const nucleo = [S.nombre, S.clase, n, S.xp, S.aciertos, S.preguntas, porTema, Math.round(t / 1000), S.fase, S.caidas].join("|");
  return [
    "EL REINO DE LOS DATOS · RPG PAES M1",
    "Héroe: " + S.nombre,
    "Clase: " + CLASES[S.clase].nombre + " · Nivel " + n + " (" + titulo(n) + ") · " + S.xp + " XP",
    "Resultado: " + progresoTexto(),
    "Aciertos: " + S.aciertos + " de " + S.preguntas + " (" + pct + "\u00a0%)",
    "Por tema: " + porTema,
    "Tiempo: " + durTexto(t) + " · Ritmo: " + ritmo + " por pregunta",
    "Caídas: " + S.caidas + " · Golpes críticos: " + S.criticos,
    "Tema a reforzar: " + temaDebil(),
    "Código: " + hashCod(nucleo)
  ].join("\n");
}
function copiar(txt, salida) {
  const ok = () => { salida.textContent = "✅ ¡Copiado! Pégalo como respuesta en la tarea de Classroom."; };
  const plan = () => {
    const ta = h("textarea", { class: "oculto" });
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    let r = false;
    try { r = document.execCommand("copy"); } catch (e) { r = false; }
    document.body.removeChild(ta);
    if (r) ok(); else salida.textContent = "No se pudo copiar automáticamente: mantén presionado el texto de abajo y cópialo.";
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, plan);
    else plan();
  } catch (e) { plan(); }
}

}

function vistaInicio() {
  const guardada = cargar();
  const nodos = [h("h1", { class: "titulo", text: "⚔️ El Reino de los Datos" }),
    h("p", { class: "sub", text: "RPG de repaso PAES M1 · Probabilidad y Estadística · 30 a 40 minutos" })];
  if (guardada) {
    const fin = guardada.fase === "final";
    nodos.push(h("div", { class: "panel" }, [
      h("h2", { text: fin ? "Tu aventura terminó" : "Partida guardada" }),
      h("p", { text: (fin ? "Ficha de " : "Partida de ") + guardada.nombre + "." }),
      h("button", { class: "btn", type: "button", onclick: () => { S = guardada; render(true); }, text: fin ? "Ver mi ficha de héroe" : "▶ Continuar partida" }),
      h("button", { class: "btn sec", type: "button", onclick: () => { borrar(); render(true); }, text: "Empezar una partida nueva" })
    ]));
    app.replaceChildren(...nodos);
    return;
  }
  let claseSel = null;
  const inp = h("input", { class: "txt", id: "nombre", type: "text", maxlength: 40, autocomplete: "off", placeholder: "Ej.: Camila Rojas" });
  const err = h("div", { class: "err", id: "err" });
  const botones = Object.keys(CLASES).map(k => {
    const c = CLASES[k];
    const b = h("button", { class: "clase", type: "button", "aria-pressed": "false", "data-clase": k, onclick: () => {
      claseSel = k;
      botones.forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    } }, [h("span", { class: "ico", text: c.icono }), h("span", null, [h("b", { text: c.nombre }), h("span", { text: c.desc })])]);
    return b;
  });
  nodos.push(h("div", { class: "panel" }, [
    h("label", { class: "lbl", for: "nombre", text: "Tu nombre y apellido" }), inp,
    h("label", { class: "lbl", text: "Elige tu clase de héroe" }),
    h("div", { class: "clases" }, botones),
    err,
    h("button", { class: "btn", id: "comenzar", type: "button", onclick: () => {
      const nom = inp.value.trim().replace(/\s+/g, " ");
      if (nom.length < 3) { err.textContent = "Escribe tu nombre y apellido para que el profe sepa quién jugó."; return; }
      if (!claseSel) { err.textContent = "Elige una clase de héroe."; return; }
      S = nuevoEstado(nom, claseSel);
      guardar(); render(true);
    }, text: "Comenzar la aventura" })
  ]));
  nodos.push(h("p", { class: "muted small", style: "text-align:center", text: "4 regiones con 3 enemigos y un jefe cada una, más el jefe final. Al terminar copias tu ficha de héroe en Classroom." }));
  app.replaceChildren(...nodos);
}
function vistaHistoria() {
  const [emo, txt] = HISTORIA[S.paso];
  const ult = S.paso === HISTORIA.length - 1;
  const ir = () => { S.fase = "mapa"; guardar(); render(true); };
  app.replaceChildren(
    h("div", { class: "panel hist" }, [
      h("div", { class: "gran", text: emo }),
      h("p", { text: txt }),
      h("div", { class: "paso", text: (S.paso + 1) + " / " + HISTORIA.length }),
      h("button", { class: "btn", id: "siguiente", type: "button", onclick: () => { if (ult) ir(); else { S.paso++; guardar(); render(true); } }, text: ult ? "¡Al mapa!" : "Siguiente →" }),
      ult ? null : h("button", { class: "btn sec", id: "saltar", type: "button", onclick: ir, text: "Saltar historia" })
    ])
  );
}
function vistaMapa() {
  const nodos = [hud(), h("h2", { text: "🗺️ Mapa del Reino", style: "color:var(--oro);margin-top:8px" })];
  if (S.desbloq === 0) {
    nodos.push(h("div", { class: "panel" }, [
      h("h2", { text: "Cómo se juega" }),
      h("ul", { class: "reglas" }, [
        h("li", { text: "Respuesta correcta = un golpe al enemigo. Los enemigos caen con 1 golpe, los jefes con 2 y el jefe final con 3." }),
        h("li", { text: "Respuesta incorrecta = pierdes 1 ❤️, ves la explicación y te sale otra pregunta." }),
        h("li", { text: "Si respondes bien en menos de 45 segundos, el golpe es crítico: ganas más XP y oro." }),
        h("li", { text: "Usa tus objetos: 🧪 poción (+2 ❤️), 📜 pergamino (elimina 2 alternativas) y 🛡️ escudo (te protege del próximo error)." }),
        h("li", { text: "Si te quedas sin vida, un sanador te levanta, pero se cobra la mitad de tu oro." })
      ])
    ]));
  }
  ZONAS.forEach((z, i) => {
    const hecha = i < S.desbloq, actual = i === S.desbloq, bloq = i > S.desbloq;
    const der = [h("div", { class: "nom", text: z.nombre }), h("div", { class: "small muted", text: z.desc })];
    if (hecha) der.push(h("div", { class: "estado ok", text: "✔ Región superada" }));
    if (bloq) der.push(h("div", { class: "estado lock", text: "🔒 Bloqueada" }));
    const card = h("div", { class: "panel" + (bloq ? " region bloq" : actual ? " region actual" : " region") }, [
      h("div", { class: "ico", text: z.icono }), h("div", { class: "info" }, der)
    ]);
    const wrap = h("div", null, [card]);
    if (actual) card.querySelector(".info").appendChild(h("button", { class: "btn", id: "entrar", type: "button", onclick: () => entrarZona(i), text: z.final ? "🐉 Enfrentar al jefe final" : "Entrar a la región" }));
    nodos.push(wrap);
  });
  nodos.push(piePagina());
  app.replaceChildren(...nodos);
}
function vistaBatalla() {
  const z = ZONAS[S.zona], e = enemigoActual(), it = POR_ID[S.q.id], fb = S.fb;
  let pips = "";
  for (let i = 0; i < e.hp; i++) pips += i < S.enemigoHp ? "♦" : "◇";
  const emo = h("span", { class: "emoji" + (fb && fb.ok ? (fb.derrotado ? " muerto" : " golpe") : ""), text: e.emoji });
  const lugar = e.final ? "Jefe final" : (e.jefe ? "Jefe de la región" : "Enemigo " + (S.enemigo + 1) + " de 3");
  const enemigo = h("div", { class: "panel enemigo" }, [
    h("div", { class: "lugar", text: z.icono + " " + z.nombre + " · " + lugar }),
    emo,
    h("div", { class: "nombre" }, [e.nombre, e.jefe ? h("span", { class: "tag", text: e.final ? "JEFE FINAL" : "JEFE" }) : null]),
    h("div", { class: "pips", "aria-label": "Vida del enemigo " + S.enemigoHp + " de " + e.hp, text: pips })
  ]);
  const carta = h("div", { class: "carta", id: "carta" }, [h("p", { text: it.enun })]);
  const tb = tablaDe(it); if (tb) carta.appendChild(tb);
  const fig = figura(it); if (fig) carta.appendChild(fig);
  carta.appendChild(h("p", { class: "preg", text: it.preg }));
  const ops = h("div", { class: "ops" });
  S.q.orden.forEach((orig, pos) => {
    let cls = "op";
    if (S.q.elim.indexOf(pos) >= 0) cls += " elim";
    if (fb) {
      if (orig === 0) cls += " bien";
      else if (pos === fb.pos) cls += " malo";
    }
    const dis = !!fb || S.q.elim.indexOf(pos) >= 0;
    ops.appendChild(h("button", { class: cls, type: "button", "data-pos": pos, disabled: dis, onclick: () => responder(pos) },
      [h("span", { class: "let", text: "ABCD"[pos] }), h("span", { text: it.ops[orig] })]));
  });
  carta.appendChild(ops);
  const nodos = [hud(), enemigo, carta];
  if (!fb) {
    const itms = h("div", { class: "items" }, [
      h("button", { class: "btn sec chico", id: "pocion", type: "button", disabled: S.items.pocion <= 0 || S.hp >= S.hpMax, onclick: usarPocion, text: "🧪 Poción (" + S.items.pocion + ")" }),
      h("button", { class: "btn sec chico", id: "pergamino", type: "button", disabled: S.items.pergamino <= 0 || S.q.elim.length > 0, onclick: usarPergamino, text: "📜 Pergamino (" + S.items.pergamino + ")" }),
      h("button", { class: "btn sec chico", id: "escudo", type: "button", disabled: S.items.escudo <= 0 || S.escudoActivo, onclick: usarEscudo, text: "🛡️ Escudo (" + S.items.escudo + ")" })
    ]);
    nodos.push(itms);
    if (S.escudoActivo) nodos.push(h("div", { class: "escudo-on", text: "🛡️ Escudo activo: tu próximo error no te quitará vida." }));
  } else {
    const exp = h("div", { class: "exp" }, [h("b", { text: "Explicación: " }), it.exp]);
    const caja = h("div", { class: "panel fb " + (fb.ok ? "bien" : "malo"), id: "fb" }, [
      h("h3", { text: fb.ok ? "✔ ¡Correcto!" : "✘ Incorrecto" }),
      h("ul", null, fb.msgs.map(m => h("li", { text: m }))),
      fb.ok ? h("details", null, [h("summary", { text: "Ver explicación" }), exp]) : exp,
      h("button", { class: "btn", id: "continuar", type: "button", onclick: continuar,
        text: fb.caido ? "Continuar…" : fb.derrotado ? (e.final ? "🏆 ¡Ver mi victoria!" : e.jefe ? "Ir a la posada →" : "Siguiente enemigo →") : "Siguiente pregunta →" })
    ]);
    nodos.push(caja);
  }
  nodos.push(piePagina());
  app.replaceChildren(...nodos);
}
function vistaCaida() {
  app.replaceChildren(hud(), h("div", { class: "panel hist" }, [
    h("div", { class: "gran", text: "💫" }),
    h("h2", { text: "Caíste en combate" }),
    h("p", { text: "Un sanador del reino te levanta con 3 ❤️, pero se cobra la mitad de tu oro. El enemigo te sigue esperando." }),
    h("button", { class: "btn", id: "levantarse", type: "button", onclick: levantarse, text: "Levantarme y seguir" })
  ]), piePagina());
}
function vistaPosada() {
  const z = ZONAS[S.posada.zona];
  const prods = [
    ["pocion", "🧪", "Poción", "Recupera 2 ❤️ (no supera tu máximo)."],
    ["pergamino", "📜", "Pergamino de descarte", "Elimina 2 alternativas incorrectas de una pregunta."],
    ["escudo", "🛡️", "Escudo", "Tu próximo error no te quita vida."]
  ];
  app.replaceChildren(hud(),
    h("div", { class: "panel" }, [
      h("h2", { text: "🏨 Posada del Cuartil" }),
      h("p", { text: "¡Superaste " + z.nombre + "! Descansas junto al fuego" + (S.posada.curo ? " y recuperas 1 ❤️." : ".") }),
      h("p", { class: "muted small", text: "Tienes " + S.oro + " de oro · Objetos: 🧪 " + S.items.pocion + " · 📜 " + S.items.pergamino + " · 🛡️ " + S.items.escudo }),
      ...prods.map(([k, ico, nom, d]) => h("div", { class: "prod" }, [
        h("span", { class: "ico", text: ico }),
        h("div", { class: "d" }, [h("b", { text: nom }), h("br"), d]),
        h("button", { class: "btn", type: "button", "data-comprar": k, disabled: S.oro < PRECIOS[k], onclick: () => comprar(k), text: PRECIOS[k] + " 💰" })
      ])),
      h("button", { class: "btn", id: "al-mapa", type: "button", onclick: () => { S.fase = "mapa"; S.posada = null; guardar(); render(true); }, text: "Volver al mapa →" })
    ]), piePagina());
}
function vistaFinal() {
  const n = nivel();
  const pct = S.preguntas ? Math.round(100 * S.aciertos / S.preguntas) : 0;
  const t = transcurrido();
  const salida = h("div", { class: "copiado", id: "copiado" });
  const texto = resumenTexto();
  const temas = TEMAS.map(tm => {
    const [a, k] = S.stats[tm];
    const p = k ? Math.round(100 * a / k) : 0;
    return h("div", { class: "tema" }, [
      h("div", { style: "display:flex;justify-content:space-between" }, [h("span", { text: tm }), h("b", { text: a + " / " + k })]),
      h("div", { class: "barra" }, h("i", { style: "width:" + p + "%" }))
    ]);
  });
  app.replaceChildren(
    h("div", { class: "panel hist" }, [
      h("div", { class: "gran", text: "🏆" }),
      h("h2", { text: "¡Derrotaste al Ensayo Interminable!" }),
      h("p", { text: "Despiertas en la sala… y ahora sabes algo que él no: las últimas preguntas de la M1 no se regalan." })
    ]),
    h("div", { class: "panel ficha" }, [
      h("h2", { text: "📜 Ficha de héroe" }),
      h("div", { class: "fila" }, [h("span", { text: "Héroe" }), h("b", { text: S.nombre })]),
      h("div", { class: "fila" }, [h("span", { text: "Clase" }), h("b", { text: CLASES[S.clase].icono + " " + CLASES[S.clase].nombre })]),
      h("div", { class: "fila" }, [h("span", { text: "Nivel" }), h("b", { text: n + " · " + titulo(n) + " (" + S.xp + " XP)" })]),
      h("div", { class: "fila" }, [h("span", { text: "Aciertos" }), h("b", { text: S.aciertos + " de " + S.preguntas + " (" + pct + "\u00a0%)" })]),
      h("div", { class: "fila" }, [h("span", { text: "Tiempo" }), h("b", { text: durTexto(t) })]),
      h("div", { class: "fila" }, [h("span", { text: "Ritmo" }), h("b", { text: (S.preguntas ? durTexto(t / S.preguntas) : "—") + " por pregunta" })]),
      h("p", { class: "small muted", text: "En la PAES M1 tienes unos 2 min 9 s por pregunta (65 preguntas en 2 h 20 min)." }),
      h("h3", { text: "Por tema", style: "margin-top:10px" }),
      ...temas,
      h("p", { style: "margin-top:10px" }, [h("b", { text: "Tema a reforzar: " }), temaDebil()]),
      h("button", { class: "btn", id: "copiar", type: "button", onclick: () => copiar(texto, salida), text: "📋 Copiar resumen para Classroom" }),
      salida,
      h("details", { style: "margin-top:8px" }, [h("summary", { text: "Ver el texto del resumen" }), h("pre", { style: "white-space:pre-wrap;font-size:15px;user-select:text", text: texto })])
    ]),
    h("button", { class: "btn sec", type: "button", onclick: () => { borrar(); S = null; render(true); }, text: "Jugar de nuevo (otra partida)" })
  );
}
function render(arriba) {
  if (!S) vistaInicio();
  else if (S.fase === "historia") vistaHistoria();
  else if (S.fase === "mapa") vistaMapa();
  else if (S.fase === "batalla") vistaBatalla();
  else if (S.fase === "caida") vistaCaida();
  else if (S.fase === "posada") vistaPosada();
  else if (S.fase === "final") vistaFinal();
  if (arriba) window.scrollTo(0, 0);
}
setInterval(() => {
  const r = document.getElementById("reloj");
  if (r && S) r.textContent = "⏱️ " + mmss(transcurrido());
}, 1000);
window.__RPG_TEST = Object.freeze({
  estado: () => S ? JSON.parse(JSON.stringify(S)) : null,
  correcta: () => (S && S.q) ? S.q.orden.indexOf(0) : -1,
  resumen: () => S ? resumenTexto() : ""
});
render(true);
</script>
</body>
</html>
